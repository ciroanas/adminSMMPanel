<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="users" data-title="Users" data-sub="User Management">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Users</h1><div class="page-sub">Manage all panel users and their accounts.</div></div>
      <div class="page-head-actions">
        <button class="btn btn-outline-secondary btn-sm" id="exportUsersBtn" data-testid="export-users-btn"><i class="fa-solid fa-file-export"></i>Export</button>
        <button class="btn btn-primary btn-sm" id="addUserBtn" data-testid="add-user-btn"><i class="fa-solid fa-user-plus"></i>Add User</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-inline"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="userSearch" placeholder="Search username, email or ID…" data-testid="user-search"></div>
        <div class="filter-bar ms-auto">
          <select class="form-select" id="userStatusFilter" style="width:auto" data-testid="user-status-filter"><option value="">All Status</option><option>Active</option><option>Blocked</option></select>
          <select class="form-select" id="userGroupFilter" style="width:auto"><option value="">All Groups</option><option>Default</option><option>VIP</option><option>Premium</option><option>Reseller</option></select>
          <select class="form-select" style="width:auto"><option value="">Any Date</option><option>Today</option><option>This Week</option><option>This Month</option></select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="usersTable">
          <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Balance</th><th>Orders</th><th>Spent</th><th>Group</th><th>Status</th><th>Created</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
      <div class="table-footer">
        <span class="text-muted small">Showing 22 of 12,450 users</span>
        <nav><ul class="pagination pagination-sm"><li class="page-item disabled"><a class="page-link">Prev</a></li><li class="page-item active"><a class="page-link">1</a></li><li class="page-item"><a class="page-link">2</a></li><li class="page-item"><a class="page-link">3</a></li><li class="page-item"><a class="page-link">Next</a></li></ul></nav>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
