<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Providers | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="providers" data-title="Providers" data-sub="Provider Management">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Providers</h1><div class="page-sub">Connect and manage your API service providers.</div></div>
      <div class="page-head-actions"><button class="btn btn-primary btn-sm" id="addProviderBtn" data-testid="add-provider-btn"><i class="fa-solid fa-plus"></i>Add Provider</button></div>
    </div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="providersTable">
          <thead><tr><th>Provider</th><th>API URL</th><th>Services</th><th>Balance</th><th>Status</th><th>Last Sync</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="providersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
