<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="categories" data-title="Categories" data-sub="Category Management">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Categories</h1><div class="page-sub">Drag categories to reorder them. Click a category to view its services.</div></div>
      <div class="page-head-actions">
        <button class="btn btn-primary btn-sm" id="newCategoryBtn" data-testid="new-category-btn"><i class="fa-solid fa-folder-plus"></i>New Category</button>
      </div>
    </div>

    <div class="alert d-flex align-items-center gap-2" style="background:var(--admin-primary-soft);border:1px solid var(--admin-border);color:var(--admin-text);border-radius:var(--radius)">
      <i class="fa-solid fa-grip-vertical"></i>
      <span class="small">Use the <b>drag handle</b> to reorder categories. Sort numbers update automatically and the order is saved.</span>
    </div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="categoriesTable">
          <thead><tr><th></th><th>ID</th><th>Category Name</th><th>Services</th><th>Status</th><th>Sort</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="categoriesTableBody" class="category-sortable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
