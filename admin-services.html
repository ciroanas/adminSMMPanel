<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="services" data-title="Services" data-sub="Service Management">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Services</h1><div class="page-sub">Manage service categories and services.</div></div>
      <div class="page-head-actions">
        <button class="btn btn-outline-secondary btn-sm" id="importServicesBtn"><i class="fa-solid fa-file-import"></i>Import Services</button>
        <button class="btn btn-outline-secondary btn-sm" id="newCategoryBtn"><i class="fa-solid fa-folder-plus"></i>New Category</button>
        <button class="btn btn-primary btn-sm" id="newServiceBtn" data-testid="new-service-btn"><i class="fa-solid fa-plus"></i>New Service</button>
      </div>
    </div>

    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabList" type="button">All Services</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabGrouped" type="button">By Category (Sortable)</button></li>
    </ul>

    <div class="tab-content">
      <!-- ALL SERVICES TABLE -->
      <div class="tab-pane fade show active" id="tabList">
        <div class="table-card">
          <div class="table-toolbar">
            <div class="search-inline"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="serviceSearch" placeholder="Search service name or ID…" data-testid="service-search"></div>
            <div class="filter-bar ms-auto">
              <select class="form-select" id="svcCategoryFilter" style="width:auto"><option value="">All Categories</option><option>Instagram Followers</option><option>Instagram Likes</option><option>TikTok Followers</option><option>YouTube Views</option><option>YouTube Subscribers</option><option>Facebook Page Likes</option><option>Twitter / X Followers</option><option>Telegram Members</option><option>Spotify Plays</option><option>Website Traffic</option></select>
              <select class="form-select" id="svcProviderFilter" style="width:auto"><option value="">All Providers</option><option>Provider A</option><option>Provider B</option><option>SMM Cloud</option><option>FastPanel API</option><option>GrowthHub</option></select>
              <select class="form-select" id="svcStatusFilter" style="width:auto"><option value="">All Status</option><option>Active</option><option>Disabled</option></select>
              <select class="form-select" id="svcTypeFilter" style="width:auto"><option value="">All Types</option><option>Normal</option><option>Package</option><option>Subscription</option></select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle" id="servicesTable">
              <thead><tr><th>ID</th><th>Category</th><th>Service Name</th><th>Price</th><th>Min</th><th>Max</th><th>Provider</th><th>Refill</th><th>Cancel</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="servicesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- BY CATEGORY (drag services within each category) -->
      <div class="tab-pane fade" id="tabGrouped">
        <div class="alert alert-info d-flex align-items-center gap-2" style="background:var(--admin-primary-soft);border:1px solid var(--admin-border);color:var(--admin-text);border-radius:var(--radius)">
          <i class="fa-solid fa-grip-vertical"></i>
          <span class="small">Drag services using the handle to reorder them <b>within their category</b>. The order is saved automatically.</span>
        </div>
        <div id="catServiceView"></div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
