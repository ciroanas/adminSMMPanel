<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appearance | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="appearance" data-title="Appearance" data-sub="Branding">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Appearance</h1><div class="page-sub">Customize the look of your panel.</div></div>
      <div class="page-head-actions"><button class="btn btn-primary btn-sm" id="saveAppearanceBtn" data-testid="save-appearance-btn"><i class="fa-solid fa-floppy-disk"></i>Save Changes</button></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card mb-4">
          <div class="card-header"><h2>Branding</h2></div>
          <div class="card-body">
            <label class="form-label">Panel Name</label><input class="form-control mb-3" id="panelNameInput" value="BoostSMM">
            <label class="form-label">Footer Text</label><input class="form-control mb-3" value="© 2026 BoostSMM. All rights reserved.">
            <label class="form-label">Logo</label>
            <div class="input-group mb-3"><input type="file" class="form-control"><span class="input-group-text"><i class="fa-solid fa-image"></i></span></div>
            <label class="form-label">Favicon</label>
            <div class="input-group"><input type="file" class="form-control"><span class="input-group-text"><i class="fa-solid fa-star"></i></span></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h2>Theme &amp; Color</h2></div>
          <div class="card-body">
            <label class="form-label">Primary Color</label>
            <div class="d-flex align-items-center gap-2 mb-3">
              <input type="color" class="form-control form-control-color" id="primaryColorInput" value="#1c1f24" style="width:52px">
              <div class="d-flex gap-2">
                <span class="color-swatch active" data-color="#1c1f24" style="background:#1c1f24"></span>
                <span class="color-swatch" data-color="#2563eb" style="background:#2563eb"></span>
                <span class="color-swatch" data-color="#16a34a" style="background:#16a34a"></span>
                <span class="color-swatch" data-color="#7c3aed" style="background:#7c3aed"></span>
                <span class="color-swatch" data-color="#dc2626" style="background:#dc2626"></span>
                <span class="color-swatch" data-color="#0d9488" style="background:#0d9488"></span>
              </div>
            </div>
            <label class="form-label">Theme</label>
            <select class="form-select"><option>Match System</option><option>Light</option><option>Dark</option></select>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card">
          <div class="card-header"><h2>Live Preview</h2></div>
          <div class="card-body">
            <div class="appearance-preview">
              <div class="ap-navbar" id="previewBtn" style="background:#1c1f24"><i class="fa-solid fa-bolt me-2"></i><span id="apName">BoostSMM</span></div>
              <div class="ap-body">
                <div class="ap-side"><div class="ap-li on"></div><div class="ap-li"></div><div class="ap-li"></div><div class="ap-li"></div><div class="ap-li"></div></div>
                <div class="ap-main">
                  <div class="card mb-3"><div class="card-body py-2"><div class="stat-label">Sample Card</div><div class="fs-5 fw-bold">₹8,45,240</div></div></div>
                  <button class="btn btn-primary btn-sm mb-3">Sample Button</button>
                  <table class="table table-hover align-middle mb-0" style="font-size:12px"><thead><tr><th>ID</th><th>User</th><th>Status</th></tr></thead><tbody><tr><td>#90001</td><td>raj</td><td><span class="badge-status status-completed">Completed</span></td></tr><tr><td>#90002</td><td>mia</td><td><span class="badge-status status-pending">Pending</span></td></tr></tbody></table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
