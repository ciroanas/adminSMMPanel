<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="reports" data-title="Reports" data-sub="Analytics">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Reports</h1><div class="page-sub">Performance and revenue analytics.</div></div>
      <div class="page-head-actions">
        <select class="form-select form-select-sm" style="width:auto"><option>Last 7 Days</option><option>Last 30 Days</option><option>This Year</option></select>
      </div>
    </div>

    <div class="stat-grid mb-4" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-card"><div class="stat-ic ic-teal"><i class="fa-solid fa-indian-rupee-sign"></i></div><div class="stat-label">Revenue</div><div class="stat-value">₹8,45,240</div></div>
      <div class="stat-card"><div class="stat-ic ic-purple"><i class="fa-solid fa-boxes-stacked"></i></div><div class="stat-label">Orders</div><div class="stat-value">85,420</div></div>
      <div class="stat-card"><div class="stat-ic ic-blue"><i class="fa-solid fa-users"></i></div><div class="stat-label">Users</div><div class="stat-value">12,450</div></div>
      <div class="stat-card"><div class="stat-ic ic-amber"><i class="fa-solid fa-money-bill-transfer"></i></div><div class="stat-label">Provider Cost</div><div class="stat-value">₹5,12,800</div></div>
      <div class="stat-card"><div class="stat-ic ic-green"><i class="fa-solid fa-chart-line"></i></div><div class="stat-label">Profit</div><div class="stat-value">₹3,32,440</div></div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-lg-6"><div class="card h-100"><div class="card-header"><h2>Orders Overview</h2></div><div class="card-body"><div id="reportOrdersChart"></div></div></div></div>
      <div class="col-lg-6"><div class="card h-100"><div class="card-header"><h2>Revenue Overview</h2></div><div class="card-body"><div id="reportRevenueChart"></div></div></div></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-6"><div class="table-card"><div class="table-toolbar"><h2 class="card-title">Top Services</h2></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Service</th><th>Orders</th><th>Revenue</th></tr></thead><tbody id="topServicesBody"></tbody></table></div></div></div>
      <div class="col-lg-6"><div class="table-card"><div class="table-toolbar"><h2 class="card-title">Top Users</h2></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>User</th><th>Orders</th><th>Spent</th></tr></thead><tbody id="topUsersBody"></tbody></table></div></div></div>
      <div class="col-12"><div class="table-card"><div class="table-toolbar"><h2 class="card-title">Provider Performance</h2></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Provider</th><th>Services</th><th>Status</th><th>Balance</th></tr></thead><tbody id="providerPerfBody"></tbody></table></div></div></div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
