<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Child Panels | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="child-panels" data-title="Child Panels" data-sub="Reseller Panels">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Child Panels</h1><div class="page-sub">Manage reseller child panels.</div></div>
    </div>

    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-inline"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="childPanelSearch" placeholder="Search panel or owner…"></div>
        <div class="filter-bar ms-auto"><select class="form-select" id="cpStatusFilter" style="width:auto"><option value="">All Status</option><option>Active</option><option>Disabled</option></select></div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="childPanelsTable">
          <thead><tr><th>Panel</th><th>Owner</th><th>Domain</th><th>Status</th><th>Orders</th><th>Created</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="childPanelsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
