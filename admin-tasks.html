<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="tasks" data-title="Tasks" data-sub="Background Tasks">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Tasks</h1><div class="page-sub">Monitor background and automated tasks.</div></div>
    </div>

    <div class="stat-grid mb-4" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card"><div class="stat-ic ic-amber"><i class="fa-solid fa-clock"></i></div><div class="stat-label">Pending</div><div class="stat-value">3</div></div>
      <div class="stat-card"><div class="stat-ic ic-blue"><i class="fa-solid fa-spinner"></i></div><div class="stat-label">Running</div><div class="stat-value">2</div></div>
      <div class="stat-card"><div class="stat-ic ic-green"><i class="fa-solid fa-circle-check"></i></div><div class="stat-label">Completed</div><div class="stat-value">6</div></div>
      <div class="stat-card"><div class="stat-ic ic-red"><i class="fa-solid fa-circle-xmark"></i></div><div class="stat-label">Failed</div><div class="stat-value">1</div></div>
    </div>

    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-inline"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="taskSearch" placeholder="Search tasks…"></div>
        <div class="filter-bar ms-auto"><select class="form-select" id="taskStatusFilter" style="width:auto"><option value="">All Status</option><option>Pending</option><option>Running</option><option>Completed</option><option>Failed</option></select></div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="tasksTable">
          <thead><tr><th>Task ID</th><th>Task Type</th><th>Order</th><th>Status</th><th>Created</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="tasksTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
