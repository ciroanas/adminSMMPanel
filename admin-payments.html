<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="payments" data-title="Payments" data-sub="Transactions">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Payments</h1><div class="page-sub">Review deposits and transactions.</div></div>
    </div>

    <div class="stat-grid mb-4" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-card"><div class="stat-ic ic-teal"><i class="fa-solid fa-indian-rupee-sign"></i></div><div class="stat-label">Total Deposits</div><div class="stat-value">₹4,82,600</div></div>
      <div class="stat-card"><div class="stat-ic ic-blue"><i class="fa-solid fa-calendar-day"></i></div><div class="stat-label">Today</div><div class="stat-value">₹18,240</div></div>
      <div class="stat-card"><div class="stat-ic ic-amber"><i class="fa-solid fa-clock"></i></div><div class="stat-label">Pending</div><div class="stat-value">₹6,500</div></div>
      <div class="stat-card"><div class="stat-ic ic-green"><i class="fa-solid fa-circle-check"></i></div><div class="stat-label">Successful</div><div class="stat-value">1,840</div></div>
      <div class="stat-card"><div class="stat-ic ic-red"><i class="fa-solid fa-circle-xmark"></i></div><div class="stat-label">Failed</div><div class="stat-value">76</div></div>
    </div>

    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-inline"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="paymentSearch" placeholder="Search transaction or user…"></div>
        <div class="filter-bar ms-auto">
          <select class="form-select" id="payMethodFilter" style="width:auto"><option value="">All Methods</option><option>UPI</option><option>Razorpay</option><option>PayPal</option><option>Crypto (USDT)</option><option>Bank Transfer</option><option>Stripe</option></select>
          <select class="form-select" id="payStatusFilter" style="width:auto"><option value="">All Status</option><option>Successful</option><option>Pending</option><option>Failed</option></select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="paymentsTable">
          <thead><tr><th>Transaction ID</th><th>User</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="paymentsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
