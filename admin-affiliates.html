<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affiliates | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="affiliates" data-title="Affiliates" data-sub="Referral Program">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Affiliates</h1><div class="page-sub">Manage the referral program and payouts.</div></div>
    </div>

    <div class="stat-grid mb-4" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="stat-ic ic-blue"><i class="fa-solid fa-user-group"></i></div><div class="stat-label">Total Affiliates</div><div class="stat-value">312</div></div>
      <div class="stat-card"><div class="stat-ic ic-purple"><i class="fa-solid fa-boxes-stacked"></i></div><div class="stat-label">Referral Orders</div><div class="stat-value">4,820</div></div>
      <div class="stat-card"><div class="stat-ic ic-green"><i class="fa-solid fa-indian-rupee-sign"></i></div><div class="stat-label">Referral Earnings</div><div class="stat-value">₹1,24,600</div></div>
    </div>

    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-inline"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="affiliateSearch" placeholder="Search affiliate…"></div>
        <div class="filter-bar ms-auto"><select class="form-select" id="affStatusFilter" style="width:auto"><option value="">All Status</option><option>Active</option><option>Disabled</option></select></div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="affiliatesTable">
          <thead><tr><th>User</th><th>Referral Count</th><th>Referral Earnings</th><th>Status</th><th>Joined</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="affiliatesTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
