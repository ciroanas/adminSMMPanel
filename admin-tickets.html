<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="tickets" data-title="Tickets" data-sub="Support">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Tickets</h1><div class="page-sub">Respond to customer support requests.</div></div>
    </div>

    <div class="stat-grid mb-4" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card"><div class="stat-ic ic-blue"><i class="fa-solid fa-envelope-open"></i></div><div class="stat-label">Open</div><div class="stat-value">18</div></div>
      <div class="stat-card"><div class="stat-ic ic-amber"><i class="fa-solid fa-hourglass-half"></i></div><div class="stat-label">Pending</div><div class="stat-value">9</div></div>
      <div class="stat-card"><div class="stat-ic ic-green"><i class="fa-solid fa-reply"></i></div><div class="stat-label">Answered</div><div class="stat-value">12</div></div>
      <div class="stat-card"><div class="stat-ic ic-gray"><i class="fa-solid fa-lock"></i></div><div class="stat-label">Closed</div><div class="stat-value">340</div></div>
    </div>

    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-inline"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="ticketSearch" placeholder="Search tickets…"></div>
        <div class="filter-bar ms-auto">
          <select class="form-select" id="ticketStatusFilter" style="width:auto"><option value="">All Status</option><option>Open</option><option>Pending</option><option>Answered</option><option>Closed</option></select>
          <select class="form-select" id="ticketPriorityFilter" style="width:auto"><option value="">All Priority</option><option>High</option><option>Medium</option><option>Low</option></select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="ticketsTable">
          <thead><tr><th>Ticket ID</th><th>User</th><th>Subject</th><th>Priority</th><th>Status</th><th>Last Reply</th><th>Created</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="ticketsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
