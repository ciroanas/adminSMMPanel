<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | BoostSMM Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page="orders" data-title="Orders" data-sub="Order Management">
  <div id="page-content">
    <div class="page-head">
      <div><h1>Orders</h1><div class="page-sub">Track and manage all customer orders.</div></div>
      <div class="page-head-actions">
        <button class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-file-export"></i>Export</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-inline"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="orderSearch" placeholder="Search order ID, username or link…" data-testid="order-search"></div>
        <div class="filter-bar ms-auto">
          <select class="form-select" id="orderStatusFilter" style="width:auto" data-testid="order-status-filter"><option value="">All Status</option><option>Pending</option><option>Processing</option><option>Completed</option><option>Partial</option><option>Cancelled</option></select>
          <select class="form-select" id="orderProviderFilter" style="width:auto"><option value="">All Providers</option><option>Provider A</option><option>Provider B</option><option>SMM Cloud</option><option>FastPanel API</option><option>GrowthHub</option></select>
          <select class="form-select" style="width:auto"><option value="">Any Date</option><option>Today</option><option>This Week</option></select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle" id="ordersTable">
          <thead><tr><th>ID</th><th>User</th><th>Service</th><th>Link</th><th>Charge</th><th>Start</th><th>Qty</th><th>Remains</th><th>Status</th><th>Provider</th><th>Created</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
      <div class="table-footer">
        <span class="text-muted small">Showing 34 of 85,420 orders</span>
        <nav><ul class="pagination pagination-sm"><li class="page-item disabled"><a class="page-link">Prev</a></li><li class="page-item active"><a class="page-link">1</a></li><li class="page-item"><a class="page-link">2</a></li><li class="page-item"><a class="page-link">Next</a></li></ul></nav>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
